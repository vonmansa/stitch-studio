server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # react-router-dom's BrowserRouter owns client-side routes like
    # /projects/5/edit — those paths don't exist as real files. Try the
    # requested file, then a directory, then fall back to index.html so
    # React boots and its router takes over. Without this, refreshing
    # the browser on /projects/5 would hit nginx directly and 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The built React app calls fetch('/api/...') with a relative path
    # (see client/src/api/client.js) — it has no idea the backend is a
    # separate container. nginx forwards those requests on its behalf.
    # "server" is the backend's service name in docker-compose.yml;
    # Compose's built-in DNS resolves it to that container's internal
    # IP on the shared network.
    location /api/ {
        proxy_pass http://server:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Uploaded project photos are served by the backend too (see
    # server/src/app.js's express.static() on /uploads), so they're
    # proxied the same way.
    location /uploads/ {
        proxy_pass http://server:4000/uploads/;
    }
}
